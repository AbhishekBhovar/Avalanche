<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="AVALANCHE">
<meta name="theme-color" content="#10243a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AVALANCHE">
<link rel="apple-touch-icon" sizes="1024x1024" href="apple-touch-icon.png?v=5">
<link rel="icon" type="image/png" href="apple-touch-icon.png?v=5">
<title>AVALANCHE</title>
<style>
:root{
  color-scheme:dark;
  --bg:#07101b;
  --bg2:#091627;
  --fg:#edf4fb;
  --muted:#8ea0b4;
  --line:#223447;
  --ice:#c9ecff;
  --ice2:#9bc7e6;
  --brand:#dff3ff;
  --surface:#101c2a;
  --surface2:#132334;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;touch-action:manipulation}
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top,#0c1930 0%,#08121f 32%,#07101b 68%,#060d17 100%);
  color:var(--fg);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overscroll-behavior:none;
  text-size-adjust:100%;
  -webkit-text-size-adjust:100%;
  -webkit-user-select:none;
  user-select:none;
}
button,input,textarea{font:inherit}
input,textarea{-webkit-user-select:text;user-select:text}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
.app{max-width:720px;margin:auto;padding:0 23px max(45px,env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;padding:24px 0 23px;gap:18px;position:relative;margin-bottom:28px}.top:before{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);background:linear-gradient(120deg,#152d45,#10253a 65%,#0d2136);border-bottom:1px solid #36516a}
.brandwrap{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:54px;height:54px;flex:0 0 auto;display:block;object-fit:contain;filter:drop-shadow(0 0 6px rgba(166,214,255,.13))}
.wordmark{font-size:15px;letter-spacing:.20em;font-weight:720;color:var(--brand);text-shadow:0 0 10px rgba(173,219,255,.12)}
.sub{font-size:10px;letter-spacing:.015em;color:#bbcfdf;line-height:1.5}
.topright{display:flex;gap:14px;flex-shrink:0}
.linkbtn{border:0;background:none;color:var(--brand);padding:5px 0;font-size:13px}
.motto{color:#b7c8d8;font:italic 19px/1.5 Georgia,serif;margin:30px 0 34px;max-width:430px}
.controls{display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.primary{background:#dcecf6;color:#112131;border:1px solid #dcecf6;border-radius:8px;padding:11px 16px;font-weight:650}
.secondary{background:transparent;border:1px solid #4e657a;color:var(--fg);border-radius:8px;padding:11px 16px}
.filters{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:8px}
.filter{padding:12px 0;background:none;border:0;color:var(--muted);border-bottom:2px solid transparent}
.filter.active{color:var(--fg);border-color:var(--ice)}
.count{display:none}
.entry{padding:24px 2px 25px;border-bottom:1px solid var(--line);position:relative}
.entrytype{display:none}
.quote{font:normal clamp(23px,5vw,32px)/1.42 Georgia,"Times New Roman",serif;letter-spacing:-.025em;white-space:pre-wrap}
.act{font:normal clamp(18px,4vw,23px)/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#d8e4ec;white-space:pre-wrap;border-left:2px solid #7ca6c3;padding-left:18px}
.meta{font-size:12px;color:var(--muted);margin-top:17px}
.entryactions{margin-top:10px;display:flex;gap:22px}
.tiny{background:none;border:0;padding:0;color:#a9cadd;font-size:12px}
.empty{text-align:center;color:#9cafc0;padding:90px 12px 45px;font-family:Georgia,serif;font-size:20px}
.foot{font-size:11px;color:#6c8297;text-align:center;margin:50px 0 14px}
.overlay{position:fixed;inset:0;z-index:10;background:linear-gradient(180deg,#08121f,#07101b);overflow:auto;padding:env(safe-area-inset-top) 23px env(safe-area-inset-bottom)}
.inner{max-width:650px;margin:auto;min-height:100%;display:flex;flex-direction:column}
.overlayheader{display:flex;align-items:center;justify-content:space-between;padding-top:24px;gap:12px}
.overlaybrand{display:flex;align-items:center;gap:10px}
.overlaybrand .logo{width:34px;height:34px}
.x{background:none;border:0;color:var(--fg);font-size:25px;padding:0 4px}
.formtitle{font:32px Georgia,serif;margin:55px 0 27px}
.choices{display:flex;gap:10px;margin-bottom:27px}
.choice{flex:1;border:1px solid #46596b;background:transparent;color:#b5c4d0;border-radius:8px;padding:12px}
.choice.selected{background:#203447;border-color:#9abed2;color:#fff}
label{display:block;color:#a7b6c4;font-size:12px;margin:22px 0 8px}
textarea,input{width:100%;background:#101e2d;color:var(--fg);border:1px solid #3a4c5e;border-radius:8px;padding:14px;outline:none}
textarea{resize:vertical;min-height:160px}
input{height:47px}
.formactions{display:flex;justify-content:space-between;gap:12px;margin-top:30px;margin-bottom:35px}
.slide{flex:1;display:flex;flex-direction:column;justify-content:center;padding:48px 0 28px;min-height:65vh}
.slidebody{text-align:center;margin:auto;width:100%;max-width:600px}
.slidequote{font:normal clamp(30px,7vw,49px)/1.38 Georgia,serif;white-space:pre-wrap;overflow-wrap:anywhere}
.slideact{font:normal clamp(23px,5.3vw,36px)/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}
.slidemeta{color:#8da3b7;font-size:13px;margin-top:27px}
.slidecontrols{display:flex;align-items:center;justify-content:space-between;gap:13px;padding:15px 0 40px}
.slidecontrols button{background:none;border:0;color:#d1e2ef;padding:10px 0}
.slidecount{font-size:12px;color:var(--muted)}
.playrow{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.playrow button{border:1px solid #4b6579;border-radius:8px;background:transparent;color:#e0ebf5;padding:7px 12px;font-size:12px}
.notice{font-size:12px;color:#a4bacb;margin-top:8px}
.hidden{display:none!important}
@media(max-width:520px){
  .top{padding-top:20px;padding-bottom:21px;margin-bottom:25px}
  .motto{margin-top:28px}
  .controls{gap:9px}
  .primary,.secondary{padding:10px 12px}
  .entry{padding-top:21px}
  .wordmark{font-size:14px}
  .brandwrap{gap:9px}
  .logo{width:53px;height:53px}
}

/* V8 opening: measured editorial typewriter reveal */
.splash{position:fixed;inset:0;z-index:1000;background:linear-gradient(150deg,#060d17,#09172a 57%,#050b14);color:#edf4fb;display:flex;align-items:center;justify-content:center;padding:36px 30px;opacity:1;transition:opacity .65s ease;isolation:isolate}
.splash.leaving{opacity:0;pointer-events:none}
.splash-copy{width:100%;max-width:680px;text-align:center;display:flex;flex-direction:column;gap:28px;align-items:center;transform:translateY(-2vh)}
.splash-line{margin:0;font:normal clamp(23px,5.9vw,36px)/1.45 Georgia,'Times New Roman',serif;letter-spacing:.015em;min-height:1.45em;text-wrap:balance;display:flex;justify-content:center;align-items:center}
.splash-line span{display:inline-block;white-space:pre-wrap;overflow-wrap:anywhere}
.splash-line.typing span::after{content:"";display:inline-block;width:2px;height:.95em;background:#e8f3fb;margin-left:6px;vertical-align:-.08em;animation:caretBlink .9s steps(1) infinite;box-shadow:0 0 10px rgba(208,233,255,.18)}
.splash-line.done span::after{display:none}
.splash-line.final span{color:#f0f8ff;text-shadow:0 0 34px rgba(167,207,246,.15)}
.splash-credit{margin:13px 0 0;color:#9fbbce;font-size:11px;font-weight:600;letter-spacing:.24em;opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .5s ease}
.splash-credit.visible{opacity:1;transform:translateY(0)}
.splash-skip{position:absolute;bottom:max(30px,env(safe-area-inset-bottom));right:27px;border:0;background:transparent;color:#9eb6c8;padding:13px 5px;font-size:12px;letter-spacing:.06em}
@keyframes caretBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.splash{transition:none}.splash-credit{transition:none}.splash-line span::after{display:none}}
.tools{position:relative;flex-shrink:0}
.tools summary{list-style:none;display:flex;align-items:center;justify-content:center;font-size:25px;color:#c7ddec;letter-spacing:.03em;cursor:pointer;width:42px;height:42px;touch-action:manipulation}
.tools summary::-webkit-details-marker{display:none}
.tools-menu{position:absolute;right:0;top:48px;min-width:168px;padding:9px 15px;background:#172e43;border:1px solid #39556d;border-radius:10px;z-index:3;box-shadow:0 12px 24px #0006;display:flex;flex-direction:column;gap:9px}
.tools-menu .linkbtn{text-align:left;white-space:nowrap}
@media(max-width:440px){.top .sub{max-width:200px}.wordmark{font-size:13px;letter-spacing:.15em}}
</style>
</head>
<body>
<section class="splash" id="splash" aria-label="Opening Muhammad Ali quote">
  <div class="splash-copy">
    <p class="splash-line">I KNOW YOU’VE GOT HIM PICKED.</p>
    <p class="splash-line">BUT THE MAN’S IN TROUBLE.</p>
    <p class="splash-line final">I’M GONNA SHOW YOU HOW GREAT I AM.</p>
    <p class="splash-credit">— MUHAMMAD ALI</p>
  </div>
  <button type="button" class="splash-skip" id="skipSplash" aria-label="Skip opening">Skip →</button>
</section>

<main class="app">
  <header class="top">
    <div class="brandwrap">
      <img class="logo" src="avalanche-emblem.png?v=5" alt="AVALANCHE mountain logo">
      <div>
        <div class="wordmark">AVALANCHE</div>
        <div class="sub">Work hard in silence. Let success be your noise.</div>
      </div>
    </div>
    <details class="tools"><summary aria-label="More options">···</summary><div class="tools-menu">
      <button class="linkbtn" id="export">Export backup</button>
      <button class="linkbtn" id="import">Import backup</button>
    </div></details>
    <input type="file" id="importFile" accept="application/json" hidden>
  </header>


  <div class="controls">
    <button class="primary" id="add">+ Add memory</button>
    <button class="secondary" id="slideshow">Slideshow ↗</button>
  </div>

  <nav class="filters" aria-label="Memory filters">
    <button class="filter active" data-filter="all">All</button>
    <button class="filter" data-filter="quote">Words</button>
    <button class="filter" data-filter="action">Actions</button>
  </nav>

  <div id="entries"></div>

</main>

<section class="overlay hidden" id="editor" aria-label="Edit memory">
  <div class="inner">
    <div class="overlayheader">
      <div class="overlaybrand">
        <img class="logo" src="avalanche-emblem.png?v=5" alt="AVALANCHE mountain logo">
        <span class="sub">AVALANCHE / NEW MEMORY</span>
      </div>
      <button class="x" id="closeEditor" aria-label="Close">×</button>
    </div>
    <h1 class="formtitle" id="formtitle">Keep the moment.</h1>
    <div class="choices">
      <button class="choice selected" data-type="quote">Words someone said</button>
      <button class="choice" data-type="action">Something someone did</button>
    </div>
    <label for="bodytext" id="bodylabel">Their exact words</label>
    <textarea id="bodytext" placeholder="Write it exactly as you remember it…"></textarea>
    <label for="person">Who (optional)</label>
    <input id="person" maxlength="120" placeholder="Name or description">
    <label for="when">When (optional)</label>
    <input id="when" maxlength="100" placeholder="A date, year or moment">
    <div class="formactions">
      <button class="secondary" id="cancelEditor">Cancel</button>
      <button class="primary" id="save">Save memory</button>
    </div>
  </div>
</section>

<section class="overlay hidden" id="viewer" aria-label="Slideshow">
  <div class="inner">
    <div class="overlayheader">
      <div class="overlaybrand">
        <img class="logo" src="avalanche-emblem.png?v=5" alt="AVALANCHE mountain logo">
        <span class="wordmark">AVALANCHE</span>
      </div>
      <button class="x" id="closeViewer" aria-label="Close slideshow">×</button>
    </div>
    <div class="slide">
      <div class="slidebody">
        <div id="slideContent"></div>
        <div class="slidemeta" id="slideMeta"></div>
      </div>
    </div>
    <div class="playrow">
      <button id="autoplay">▶ Auto-play</button>
      <span class="slidecount">5 seconds per memory</span>
    </div>
    <div class="slidecontrols">
      <button id="prev">← Previous</button>
      <span class="slidecount" id="slideCount"></span>
      <button id="next">Next →</button>
    </div>
  </div>
</section>

<script>
(()=>{
  'use strict';
  const splash=document.getElementById('splash');
  let closed=false;
  function close(){
    if(closed)return;
    closed=true;
    splash.classList.add('leaving');
    setTimeout(()=>splash.remove(),1150);
  }
  document.getElementById('skipSplash').addEventListener('click',close);
  // Full text is available immediately even if JavaScript fails.
  // Allow time to read it; no letter or sentence animations.
  setTimeout(close,7800);
})();
</script>
<script>
(()=>{
  'use strict';
  const KEY='avalanche.memories.v1';
  const $=id=>document.getElementById(id);
  let memories=[];
  let storageReadFailed=false;
  try{
    const v=JSON.parse(localStorage.getItem(KEY)||'[]');
    if(Array.isArray(v))memories=v.filter(e=>e&&typeof e.text==='string').map(e=>({...e,type:e.type==='action'?'action':'quote'}));
  }catch(e){storageReadFailed=true;alert('Your saved memories could not be read on this browser. AVALANCHE will not change your existing storage unless you save or import an entry.');}

  let filter='all',kind='quote',editId=null,slides=[],slideIndex=0,timer=null;

  const saveData=()=>{
    if(storageReadFailed){alert('Storage could not be read; no changes have been saved. Export your data from the original browser if possible.');return;}
    try{localStorage.setItem(KEY,JSON.stringify(memories));}
    catch(e){alert('Unable to save on this device. Try exporting a backup.');}
  };

  const safeText=(tag,cls,content)=>{
    const n=document.createElement(tag);
    n.className=cls;
    n.textContent=content;
    return n;
  };

  function meta(e){ return [e.person,e.when].filter(Boolean).join(' · '); }

  function render(){
    const list=memories.filter(e=>filter==='all'||e.type===filter).slice().reverse();
    $('entries').replaceChildren();
    if(!list.length){
      $('entries').append(safeText('div','empty','Your words and moments will appear here.'));
      return;
    }
    for(const e of list){
      const el=safeText('article','entry','');
      el.append(safeText('div',e.type==='quote'?'quote':'act',e.type==='quote'?'“'+e.text+'”':e.text));
      if(meta(e)) el.append(safeText('div','meta',meta(e)));
      const actions=safeText('div','entryactions','');
      const edit=safeText('button','tiny','Edit');
      edit.onclick=()=>openEditor(e);
      const del=safeText('button','tiny','Delete');
      del.onclick=()=>{ if(confirm('Permanently delete this memory?')){ memories=memories.filter(x=>x.id!==e.id); saveData(); render(); } };
      actions.append(edit,del);
      el.append(actions);
      $('entries').append(el);
    }
  }

  function setKind(v){
    kind=v;
    document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('selected',b.dataset.type===v));
    $('bodylabel').textContent=v==='quote'?'Their exact words':'What happened';
    $('bodytext').placeholder=v==='quote'?'Write it exactly as you remember it…':'Describe what they did…';
  }

  function openEditor(e){
    editId=e?.id??null;
    setKind(e?.type??'quote');
    $('formtitle').textContent=e?'Edit memory.':'Keep the moment.';
    $('bodytext').value=e?.text??'';
    $('person').value=e?.person??'';
    $('when').value=e?.when??'';
    $('editor').classList.remove('hidden');
    document.body.style.overflow='hidden';
  }

  function closeEditor(){
    $('editor').classList.add('hidden');
    document.body.style.overflow='';
  }

  $('add').onclick=()=>openEditor();
  $('closeEditor').onclick=closeEditor;
  $('cancelEditor').onclick=closeEditor;
  document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>setKind(b.dataset.type));

  $('save').onclick=()=>{
    const t=$('bodytext').value.trim();
    if(!t){ $('bodytext').focus(); return; }
    const original=memories.find(x=>x.id===editId);
    const item={
      id:original?.id??(crypto.randomUUID?.()??String(Date.now())),
      type:kind,
      text:t,
      person:$('person').value.trim(),
      when:$('when').value.trim(),
      created:original?.created??Date.now()
    };
    if(original) memories=memories.map(x=>x.id===editId?item:x);
    else memories.push(item);
    saveData();
    closeEditor();
    render();
  };

  document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{
    filter=b.dataset.filter;
    document.querySelectorAll('.filter').forEach(n=>n.classList.toggle('active',n===b));
    render();
  });

  function stop(){
    if(timer) clearInterval(timer);
    timer=null;
    $('autoplay').textContent='▶ Auto-play';
  }

  function showSlide(){
    const e=slides[slideIndex];
    if(!e) return;
    const c=$('slideContent');
    c.className=e.type==='quote'?'slidequote':'slideact';
    c.textContent=e.type==='quote'?'“'+e.text+'”':e.text;
    $('slideMeta').textContent=meta(e);
    $('slideCount').textContent=`${slideIndex+1} / ${slides.length}`;
  }

  function advance(v){
    slideIndex=(slideIndex+v+slides.length)%slides.length;
    showSlide();
  }

  $('slideshow').onclick=()=>{
    slides=memories.filter(e=>filter==='all'||e.type===filter).slice().reverse();
    if(!slides.length){ alert('Add a memory first to start the slideshow.'); return; }
    slideIndex=0;
    showSlide();
    $('viewer').classList.remove('hidden');
    document.body.style.overflow='hidden';
  };

  $('prev').onclick=()=>advance(-1);
  $('next').onclick=()=>advance(1);
  $('autoplay').onclick=()=>{
    if(timer){ stop(); }
    else {
      timer=setInterval(()=>advance(1),5000);
      $('autoplay').textContent='Ⅱ Pause';
    }
  };

  $('closeViewer').onclick=()=>{
    stop();
    $('viewer').classList.add('hidden');
    document.body.style.overflow='';
  };

  document.addEventListener('keydown',e=>{
    if(!$('viewer').classList.contains('hidden')){
      if(e.key==='ArrowRight') advance(1);
      if(e.key==='ArrowLeft') advance(-1);
    }
    if(e.key==='Escape'){
      if(!$('viewer').classList.contains('hidden')) $('closeViewer').click();
      else if(!$('editor').classList.contains('hidden')) closeEditor();
    }
  });

  $('export').onclick=()=>{
    const blob=new Blob([JSON.stringify({app:'AVALANCHE',version:8,memories},null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='avalanche-backup.json';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  };

  $('import').onclick=()=>$('importFile').click();
  $('importFile').onchange=async e=>{
    const file=e.target.files?.[0];
    if(!file) return;
    try{
      const raw=JSON.parse(await file.text());
      const entries=Array.isArray(raw)?raw:raw.memories;
      if(!Array.isArray(entries)||entries.some(x=>!x||typeof x.text!=='string'||!['quote','action'].includes(x.type))) throw Error('Invalid backup');
      if(!confirm(`Import ${entries.length} memories? This replaces the current book. Export a backup first if you want to keep it.`)) return;
      memories=entries.map(x=>({
        id:String(x.id??crypto.randomUUID?.()??Date.now()),
        type:x.type,
        text:x.text,
        person:String(x.person??''),
        when:String(x.when??''),
        created:Number(x.created)||Date.now()
      }));
      saveData();
      render();
    }catch(err){
      alert('Could not import this file. Choose a valid AVALANCHE backup.');
    }finally{ e.target.value=''; }
  };

  // Reduce double-tap zoom / accidental gesture zoom in Safari.
  let lastTouchEnd=0;
  document.addEventListener('touchend',function(event){
    const now=(new Date()).getTime();
    if(now-lastTouchEnd<=300){ event.preventDefault(); }
    lastTouchEnd=now;
  },{passive:false});

  render();
})();
</script>
</body>
</html>
